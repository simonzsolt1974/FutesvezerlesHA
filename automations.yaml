              %} {% set vals = [] %} {% if is_number(s1) %}{% set vals = vals + [s1
              | float] %}{% endif %} {% if is_number(s2) %}{% set vals = vals + [s2
              | float] %}{% endif %} {% if is_number(s3) %}{% set vals = vals + [s3
