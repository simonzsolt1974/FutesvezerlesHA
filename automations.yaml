- id: '1789400000005'
  alias: Padlófűtés tanulás - ciklus észlelés (földszint)
  description: 'Rev.4: szelepkapcsolásból (inverz logika: switch ON = szelep ZÁR =
    fűtés KI; OFF = szelep NYIT = fűtés BE) fűtési ciklus észlelés. Hamis cikluskezdés
    védve (szivattyú-ON ellenőrzés), ciklus közbeni esemény-zászlók (ablak / szivattyú),
    mode: queued. Zárásnál érvényes- ség-szűrés az utólagos zászlók alapján, majd
    utánmelegedés-megfigyelés elindítása (figyel flag). A tanult rise a 0007-ben frissül.'
  triggers:
  - trigger: state
    entity_id:
    - switch.padlofutes_foldszint_l1
    - switch.padlofutes_foldszint_l2
    - switch.padlofutes_foldszint_l3
    - switch.padlofutes_foldszint_l4
  - trigger: state
    entity_id: switch.padlofutes_szivattyu_mukodes_jelzo
    id: szivattyu_valt
  conditions: []
  actions:
  - variables:
      entityType: '{{ trigger.to_state.entity_id if trigger.to_state else '''' }}'
      uj: '{{ trigger.to_state.state if trigger.to_state else ''unknown'' }}'
      regi: '{{ trigger.from_state.state if trigger.from_state else ''unavailable''
        }}'
  - choose:
    - conditions:
      - condition: trigger
        id: szivattyu_valt
      sequence:
      - if:
        - condition: template
          value_template: '{{ not is_state(''switch.padlofutes_szivattyu_mukodes_jelzo'',
            ''on'') }}'
        then:
        - action: input_boolean.turn_on
          target:
            entity_id:
            - input_boolean.padlofutes_szivattyu_ciklus_konyha
            - input_boolean.padlofutes_szivattyu_ciklus_haloszoba
            - input_boolean.padlofutes_szivattyu_ciklus_furdoszoba
            - input_boolean.padlofutes_szivattyu_ciklus_nappali
    - conditions:
      - condition: template
        value_template: '{{ is_state(''switch.padlofutes_szivattyu_mukodes_jelzo'',
          ''on'') and regi == ''on'' and uj == ''off'' }}'
      sequence:
      - variables:
          zonaList:
          - zona: konyha
            sw: switch.padlofutes_foldszint_l1
            temp: sensor.foldszint_konyha_homero_temperature
            kezdetN: input_number.padlofutes_kezdet_konyha
            kezdete: input_datetime.padlofutes_ido_konyha
            figyelB: input_boolean.padlofutes_figyel_konyha
            ablakZ: input_boolean.padlofutes_ablak_ciklus_konyha
            szivZ: input_boolean.padlofutes_szivattyu_ciklus_konyha
            tanulandoIdo: input_datetime.padlofutes_tanulando_ido_konyha
            kintiN: input_number.padlofutes_kinti_konyha
          - zona: haloszoba
            sw: switch.padlofutes_foldszint_l2
            temp: sensor.foldszint_haloszoba_homero_temperature
            kezdetN: input_number.padlofutes_kezdet_haloszoba
            kezdete: input_datetime.padlofutes_ido_haloszoba
            figyelB: input_boolean.padlofutes_figyel_haloszoba
            ablakZ: input_boolean.padlofutes_ablak_ciklus_haloszoba
            szivZ: input_boolean.padlofutes_szivattyu_ciklus_haloszoba
            tanulandoIdo: input_datetime.padlofutes_tanulando_ido_haloszoba
            kintiN: input_number.padlofutes_kinti_haloszoba
          - zona: furdoszoba
            sw: switch.padlofutes_foldszint_l3
            temp: sensor.foldszint_furdoszoba_homero_temperature
            kezdetN: input_number.padlofutes_kezdet_furdoszoba
            kezdete: input_datetime.padlofutes_ido_furdoszoba
            figyelB: input_boolean.padlofutes_figyel_furdoszoba
            ablakZ: input_boolean.padlofutes_ablak_ciklus_furdoszoba
            szivZ: input_boolean.padlofutes_szivattyu_ciklus_furdoszoba
            tanulandoIdo: input_datetime.padlofutes_tanulando_ido_furdoszoba
            kintiN: input_number.padlofutes_kinti_furdoszoba
          - zona: nappali
            sw: switch.padlofutes_foldszint_l4
            temp: sensor.foldszint_nappali_homero_temperature
            kezdetN: input_number.padlofutes_kezdet_nappali
            kezdete: input_datetime.padlofutes_ido_nappali
            figyelB: input_boolean.padlofutes_figyel_nappali
            ablakZ: input_boolean.padlofutes_ablak_ciklus_nappali
            szivZ: input_boolean.padlofutes_szivattyu_ciklus_nappali
            tanulandoIdo: input_datetime.padlofutes_tanulando_ido_nappali
            kintiN: input_number.padlofutes_kinti_nappali
          zona: '{% set l = (zonaList | selectattr(''sw'', ''equalto'', entityType)
            | list) %} {{ l[0] if l | length > 0 else none }}'
          tempOk: '{{ is_number(states(zona.temp)) if zona is not none else false
