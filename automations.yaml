- id: '1789400000001'
  alias: Padlófűtés földszint automatikus szabályozás (prediktív, rev.4)
  description: 'Rev.4: 4 zóna, percenkénti futás IF/ELSE zónaágakkal — egy zóna futó
    ablak-timere NEM állítja le a többi zóna feldolgozását (stop elhagyva). Prediktív
    zárás: ha a tanult küszöb aktív, a szelep a célhőfok ELŐTT zár (utánmelegedés-kompenzáció);
    a +0,2 hiszterézis biztonsági biztosíték. Ablak-timer alatt a szelep ZÁRVA marad
    (10 perc).'
  triggers:
  - trigger: time_pattern
    minutes: /1
    id: percenkenti
  - trigger: homeassistant
    event: start
    id: ha_start
  - trigger: time
    at: '21:00:00'
    id: ejszaka_start
  - trigger: time
    at: 06:00:00
    id: nappal_start
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.padlofutes_ablak_konyha
    id: ablak_konyha_vege
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.padlofutes_ablak_haloszoba
    id: ablak_haloszoba_vege
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.padlofutes_ablak_furdoszoba
    id: ablak_furdoszoba_vege
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.padlofutes_ablak_nappali
    id: ablak_nappali_vege
  conditions: []
  actions:
  - variables:
      ejszaka: '{{ now().hour >= 21 or now().hour < 6 }}'
      ejszaka_percek: "{% if now().hour >= 21 %}\n  {{ (now().hour - 21) * 60 + now().minute
        }}\n{% else %}\n  {{ (now().hour + 3) * 60 + now().minute }}\n{% endif %}"
      ejszaka_lepes: '{{ ((ejszaka_percek | int) // 30) * 0.5 }}'
      cel_konyha: '{{ 21 if not ejszaka else [18, 21 - (ejszaka_lepes | float)] |
        max }}'
      cel_haloszoba: '{{ 22 if not ejszaka else [19, 22 - (ejszaka_lepes | float)]
        | max }}'
      cel_furdoszoba: '{{ 23 if not ejszaka else [19, 23 - (ejszaka_lepes | float)]
        | max }}'
      cel_nappali: '{{ 22 if not ejszaka else [19, 22 - (ejszaka_lepes | float)] |
        max }}'
  - choose:
    - conditions:
      - condition: trigger
        id: ablak_konyha_vege
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.padlofutes_elotte_konyha
        data:
          value: '{{ states(''sensor.foldszint_konyha_homero_temperature'') | float(0)
            if is_number(states(''sensor.foldszint_konyha_homero_temperature'')) else
            0 }}'
    - conditions:
      - condition: trigger
        id: ablak_haloszoba_vege
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.padlofutes_elotte_haloszoba
        data:
          value: '{{ states(''sensor.foldszint_haloszoba_homero_temperature'') | float(0)
            if is_number(states(''sensor.foldszint_haloszoba_homero_temperature''))
            else 0 }}'
    - conditions:
      - condition: trigger
        id: ablak_furdoszoba_vege
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.padlofutes_elotte_furdoszoba
        data:
          value: '{{ states(''sensor.foldszint_furdoszoba_homero_temperature'') |
            float(0) if is_number(states(''sensor.foldszint_furdoszoba_homero_temperature''))
            else 0 }}'
    - conditions:
      - condition: trigger
        id: ablak_nappali_vege
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.padlofutes_elotte_nappali
        data:
          value: '{{ states(''sensor.foldszint_nappali_homero_temperature'') | float(0)
            if is_number(states(''sensor.foldszint_nappali_homero_temperature''))
            else 0 }}'
    - conditions:
      - condition: trigger
        id:
        - ejszaka_start
        - nappal_start
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.padlofutes_elotte_konyha
        data:
          value: '{{ states(''sensor.foldszint_konyha_homero_temperature'') | float(0)
            if is_number(states(''sensor.foldszint_konyha_homero_temperature'')) else
            0 }}'
      - action: input_number.set_value
        target:
          entity_id: input_number.padlofutes_elotte_haloszoba
        data:
          value: '{{ states(''sensor.foldszint_haloszoba_homero_temperature'') | float(0)
            if is_number(states(''sensor.foldszint_haloszoba_homero_temperature''))
            else 0 }}'
      - action: input_number.set_value
        target:
          entity_id: input_number.padlofutes_elotte_furdoszoba
        data:
          value: '{{ states(''sensor.foldszint_furdoszoba_homero_temperature'') |
            float(0) if is_number(states(''sensor.foldszint_furdoszoba_homero_temperature''))
            else 0 }}'
      - action: input_number.set_value
        target:
          entity_id: input_number.padlofutes_elotte_nappali
        data:
          value: '{{ states(''sensor.foldszint_nappali_homero_temperature'') | float(0)
            if is_number(states(''sensor.foldszint_nappali_homero_temperature''))
            else 0 }}'
  - if:
    - condition: template
      value_template: '{{ states(''switch.padlofutes_szivattyu_mukodes_jelzo'') !=
        ''on'' }}'
    then:
    - action: switch.turn_off
      target:
        entity_id:
        - switch.padlofutes_foldszint_l1
        - switch.padlofutes_foldszint_l2
        - switch.padlofutes_foldszint_l3
        - switch.padlofutes_foldszint_l4
    - stop: Szivattyú nem ON – minden szelep NYITVA, fűtési zónavezérlés leáll
    else: []
  - repeat:
      for_each:
      - zone: konyha
        switch_entity: switch.padlofutes_foldszint_l1
        temp_entity: sensor.foldszint_konyha_homero_temperature
        baseline_entity: input_number.padlofutes_elotte_konyha
        ablakZaszo_entity: input_boolean.padlofutes_ablak_ciklus_konyha
        timer_entity: timer.padlofutes_ablak_konyha
        kuszob_entity: input_number.padlofutes_kuszob_konyha
        predAktiv_entity: input_boolean.padlofutes_prediktiv_konyha
        tanult_entity: input_number.padlofutes_rise_konyha
      - zone: haloszoba
        switch_entity: switch.padlofutes_foldszint_l2
        temp_entity: sensor.foldszint_haloszoba_homero_temperature
        baseline_entity: input_number.padlofutes_elotte_haloszoba
        ablakZaszo_entity: input_boolean.padlofutes_ablak_ciklus_haloszoba
        timer_entity: timer.padlofutes_ablak_haloszoba
        kuszob_entity: input_number.padlofutes_kuszob_haloszoba
        predAktiv_entity: input_boolean.padlofutes_prediktiv_haloszoba
        tanult_entity: input_number.padlofutes_rise_haloszoba
      - zone: furdoszoba
        switch_entity: switch.padlofutes_foldszint_l3
        temp_entity: sensor.foldszint_furdoszoba_homero_temperature
        baseline_entity: input_number.padlofutes_elotte_furdoszoba
        ablakZaszo_entity: input_boolean.padlofutes_ablak_ciklus_furdoszoba
        timer_entity: timer.padlofutes_ablak_furdoszoba
        kuszob_entity: input_number.padlofutes_kuszob_furdoszoba
        predAktiv_entity: input_boolean.padlofutes_prediktiv_furdoszoba
        tanult_entity: input_number.padlofutes_rise_furdoszoba
      - zone: nappali
        switch_entity: switch.padlofutes_foldszint_l4
        temp_entity: sensor.foldszint_nappali_homero_temperature
        baseline_entity: input_number.padlofutes_elotte_nappali
        ablakZaszo_entity: input_boolean.padlofutes_ablak_ciklus_nappali
        timer_entity: timer.padlofutes_ablak_nappali
        kuszob_entity: input_number.padlofutes_kuszob_nappali
        predAktiv_entity: input_boolean.padlofutes_prediktiv_nappali
        tanult_entity: input_number.padlofutes_rise_nappali
      sequence:
      - variables:
          temp: '{{ states(repeat.item.temp_entity) | float(0) }}'
          temp_ok: '{{ is_number(states(repeat.item.temp_entity)) }}'
          baseline: '{{ states(repeat.item.baseline_entity) | float(0) }}'
          predAktiv: '{{ is_state(repeat.item.predAktiv_entity, ''on'') }}'
          kuszob: '{{ states(repeat.item.kuszob_entity) | float(0) }}'
          tanult: '{{ states(repeat.item.tanult_entity) | float(0) }}'
          predLehetseges: '{{ predAktiv and tanult > 0.0 and kuszob > 0.15 }}'
          cel: "{% set c = {\n  'konyha': cel_konyha,\n  'haloszoba': cel_haloszoba,\n
            \ 'furdoszoba': cel_furdoszoba,\n  'nappali': cel_nappali\n} %} {{ c[repeat.item.zone]
            | float(0) }}"
      - if:
        - condition: template
          value_template: '{{ is_state(repeat.item.timer_entity, ''active'') }}'
        then:
        - if:
          - condition: template
            value_template: '{{ temp_ok and temp >= baseline + 0.15 }}'
          then:
          - action: input_number.set_value
            target:
              entity_id: '{{ repeat.item.baseline_entity }}'
            data:
              value: '{{ temp }}'
        else:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ not temp_ok }}'
            sequence:
            - action: switch.turn_on
              target:
                entity_id: '{{ repeat.item.switch_entity }}'
            - action: input_number.set_value
              target:
                entity_id: '{{ repeat.item.baseline_entity }}'
              data:
                value: 0
          - conditions:
            - condition: template
              value_template: '{{ baseline == 0 }}'
            sequence:
            - action: input_number.set_value
              target:
                entity_id: '{{ repeat.item.baseline_entity }}'
              data:
                value: '{{ temp }}'
          - conditions:
            - condition: template
              value_template: '{{ not is_state(repeat.item.timer_entity, ''active'')
                and temp <= baseline - 1.0 }}'
            sequence:
            - action: switch.turn_on
              target:
                entity_id: '{{ repeat.item.switch_entity }}'
            - action: timer.start
              target:
                entity_id: '{{ repeat.item.timer_entity }}'
              data:
                duration: 00:10:00
            - action: input_boolean.turn_on
              target:
                entity_id: '{{ repeat.item.ablakZaszo_entity }}'
          - conditions:
            - condition: template
              value_template: '{{ not is_state(repeat.item.timer_entity, ''active'')
                and predLehetseges and is_state(repeat.item.switch_entity, ''off'')
                and temp >= kuszob }}'
            sequence:
            - action: switch.turn_on
              target:
                entity_id: '{{ repeat.item.switch_entity }}'
          - conditions:
            - condition: template
              value_template: '{{ not is_state(repeat.item.timer_entity, ''active'')
                and temp > cel + 0.2 }}'
            sequence:
            - action: switch.turn_on
              target:
                entity_id: '{{ repeat.item.switch_entity }}'
          - conditions:
            - condition: template
              value_template: '{{ not is_state(repeat.item.timer_entity, ''active'')
                and temp < cel - 0.2 }}'
            sequence:
            - action: switch.turn_off
              target:
                entity_id: '{{ repeat.item.switch_entity }}'
        - if:
          - condition: template
            value_template: '{{ temp_ok and not is_state(repeat.item.timer_entity,
              ''active'') and temp >= baseline + 0.15 }}'
          then:
          - action: input_number.set_value
            target:
              entity_id: '{{ repeat.item.baseline_entity }}'
            data:
              value: '{{ temp }}'
  mode: queued
  max: 10
- id: '1789400000002'
  alias: Padlófűtés emelet automatikus szabályozás
  description: 'Emelet, 4 zóna (dolgozó/fürdő/háló/nappali), nappali (06-19) / éjszakai
    (19-06) célok, ablaknyitás-felismerés. Szeleplogika (inverz): switch ON = szelep
    ZÁR (fűtés KI), switch OFF = szelep NYIT (fűtés BE). Baseline: percenként követi
    a lassú (>=0,15 C/perc) mozgást, gyors esésnél fagy -> kumulatív -1 C = ablak.'
  triggers:
  - trigger: time_pattern
    minutes: /1
    id: ot_perc
  - trigger: homeassistant
    event: start
    id: ha_start
  - trigger: time
    at: '19:00:00'
    id: ejszaka_start
  - trigger: time
    at: 06:00:00
    id: nappal_start
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.padlofutes_ablak_dolgozo_emelet
    id: ablak_dolgozo_vege
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.padlofutes_ablak_furdoszoba_emelet
    id: ablak_furdoszoba_vege
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.padlofutes_ablak_haloszoba_emelet
    id: ablak_haloszoba_vege
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.padlofutes_ablak_nappali_emelet
    id: ablak_nappali_vege
  conditions: []
  actions:
  - variables:
      ejszaka: '{{ now().hour >= 19 or now().hour < 6 }}'
      ejszaka_percek: "{% if now().hour >= 19 %}\n  {{ (now().hour - 19) * 60 + now().minute
        }}\n{% else %}\n  {{ (now().hour + 5) * 60 + now().minute }}\n{% endif %}"
      ejszaka_lepes: '{{ ((ejszaka_percek | int) // 30) * 0.5 }}'
      cel_dolgozo: '{{ 22.5 if not ejszaka else [15, 22.5 - (ejszaka_lepes | float)]
        | max }}'
      cel_furdoszoba: '{{ 15 if not ejszaka else [10, 15 - (ejszaka_lepes | float)]
        | max }}'
      cel_haloszoba: '{{ 15 if not ejszaka else [10, 15 - (ejszaka_lepes | float)]
        | max }}'
      cel_nappali: '{{ 15 if not ejszaka else [10, 15 - (ejszaka_lepes | float)] |
        max }}'
  - choose:
    - conditions:
      - condition: trigger
        id: ablak_dolgozo_vege
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.padlofutes_elotte_dolgozo_emelet
        data:
          value: "{% if is_number(states('sensor.dolgozo_emelet_homero_temperature'))
            %}\n  {{ states('sensor.dolgozo_emelet_homero_temperature') | float }}\n{%
            else %}\n  0\n{% endif %}"
    - conditions:
      - condition: trigger
        id: ablak_furdoszoba_vege
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.padlofutes_elotte_furdoszoba_emelet
        data:
          value: "{% if is_number(states('sensor.furdoszoba_emelet_homero_temperature'))
            %}\n  {{ states('sensor.furdoszoba_emelet_homero_temperature') | float
            }}\n{% else %}\n  0\n{% endif %}"
    - conditions:
      - condition: trigger
        id: ablak_haloszoba_vege
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.padlofutes_elotte_haloszoba_emelet
        data:
          value: "{% if is_number(states('sensor.haloszoba_emelet_homero_temperature'))
            %}\n  {{ states('sensor.haloszoba_emelet_homero_temperature') | float
            }}\n{% else %}\n  0\n{% endif %}"
    - conditions:
      - condition: trigger
        id: ablak_nappali_vege
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.padlofutes_elotte_nappali_emelet
        data:
          value: "{% if is_number(states('sensor.nappali_emelet_homero_temperature'))
            %}\n  {{ states('sensor.nappali_emelet_homero_temperature') | float }}\n{%
            else %}\n  0\n{% endif %}"
    - conditions:
      - condition: trigger
        id:
        - ejszaka_start
        - nappal_start
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.padlofutes_elotte_dolgozo_emelet
        data:
          value: "{% if is_number(states('sensor.dolgozo_emelet_homero_temperature'))
            %}\n  {{ states('sensor.dolgozo_emelet_homero_temperature') | float }}\n{%
            else %}\n  0\n{% endif %}"
      - action: input_number.set_value
        target:
          entity_id: input_number.padlofutes_elotte_furdoszoba_emelet
        data:
          value: "{% if is_number(states('sensor.furdoszoba_emelet_homero_temperature'))
            %}\n  {{ states('sensor.furdoszoba_emelet_homero_temperature') | float
            }}\n{% else %}\n  0\n{% endif %}"
      - action: input_number.set_value
        target:
          entity_id: input_number.padlofutes_elotte_haloszoba_emelet
        data:
          value: "{% if is_number(states('sensor.haloszoba_emelet_homero_temperature'))
            %}\n  {{ states('sensor.haloszoba_emelet_homero_temperature') | float
            }}\n{% else %}\n  0\n{% endif %}"
      - action: input_number.set_value
        target:
          entity_id: input_number.padlofutes_elotte_nappali_emelet
        data:
          value: "{% if is_number(states('sensor.nappali_emelet_homero_temperature'))
            %}\n  {{ states('sensor.nappali_emelet_homero_temperature') | float }}\n{%
            else %}\n  0\n{% endif %}"
  - if:
    - condition: template
      value_template: '{{ states(''switch.padlofutes_szivattyu_mukodes_jelzo'') !=
        ''on'' }}'
    then:
    - action: switch.turn_off
      target:
        entity_id:
        - switch.padlofutes_emelet_l1
        - switch.padlofutes_emelet_l2
        - switch.padlofutes_emelet_l3
        - switch.padlofutes_emelet_l4
    - stop: Szivattyú nem ON – minden szelep NYITVA, fűtési zónavezérlés leáll
  - repeat:
      for_each:
      - zone: dolgozo
        switch_entity: switch.padlofutes_emelet_l2
        temp_entity: sensor.dolgozo_emelet_homero_temperature
        baseline_entity: input_number.padlofutes_elotte_dolgozo_emelet
        timer_entity: timer.padlofutes_ablak_dolgozo_emelet
      - zone: furdoszoba
        switch_entity: switch.padlofutes_emelet_l1
        temp_entity: sensor.furdoszoba_emelet_homero_temperature
        baseline_entity: input_number.padlofutes_elotte_furdoszoba_emelet
        timer_entity: timer.padlofutes_ablak_furdoszoba_emelet
      - zone: haloszoba
        switch_entity: switch.padlofutes_emelet_l3
        temp_entity: sensor.haloszoba_emelet_homero_temperature
        baseline_entity: input_number.padlofutes_elotte_haloszoba_emelet
        timer_entity: timer.padlofutes_ablak_haloszoba_emelet
      - zone: nappali
        switch_entity: switch.padlofutes_emelet_l4
        temp_entity: sensor.nappali_emelet_homero_temperature
        baseline_entity: input_number.padlofutes_elotte_nappali_emelet
        timer_entity: timer.padlofutes_ablak_nappali_emelet
      sequence:
      - variables:
          temp: '{{ states(repeat.item.temp_entity) | float(0) }}'
          temp_ok: '{{ is_number(states(repeat.item.temp_entity)) }}'
          baseline: '{{ states(repeat.item.baseline_entity) | float(0) }}'
          timer_idle: '{{ is_state(repeat.item.timer_entity, ''idle'') }}'
          cel: "{% set c = {\n  'dolgozo': cel_dolgozo,\n  'furdoszoba': cel_furdoszoba,\n
            \ 'haloszoba': cel_haloszoba,\n  'nappali': cel_nappali\n} %} {{ c[repeat.item.zone]
            | float(0) }}"
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ not temp_ok }}'
          sequence:
          - action: switch.turn_on
            target:
              entity_id: '{{ repeat.item.switch_entity }}'
          - action: input_number.set_value
            target:
              entity_id: '{{ repeat.item.baseline_entity }}'
            data:
              value: 0
        - conditions:
          - condition: template
            value_template: '{{ baseline == 0 and timer_idle }}'
          sequence:
          - action: input_number.set_value
            target:
              entity_id: '{{ repeat.item.baseline_entity }}'
            data:
              value: '{{ temp }}'
        - conditions:
          - condition: template
            value_template: '{{ timer_idle and temp <= baseline - 1.0 }}'
          sequence:
          - action: switch.turn_on
            target:
              entity_id: '{{ repeat.item.switch_entity }}'
          - action: timer.start
            target:
              entity_id: '{{ repeat.item.timer_entity }}'
            data:
              duration: 00:10:00
        - conditions:
          - condition: template
            value_template: '{{ timer_idle and temp > cel + 0.2 }}'
          sequence:
          - action: switch.turn_on
            target:
              entity_id: '{{ repeat.item.switch_entity }}'
        - conditions:
          - condition: template
            value_template: '{{ timer_idle and temp < cel - 0.2 }}'
          sequence:
          - action: switch.turn_off
            target:
              entity_id: '{{ repeat.item.switch_entity }}'
      - if:
        - condition: template
          value_template: "{{ temp_ok and is_state(repeat.item.timer_entity, 'idle')\n
            \ and temp >= baseline - 0.15 }}"
        then:
        - action: input_number.set_value
          target:
            entity_id: '{{ repeat.item.baseline_entity }}'
          data:
            value: '{{ temp }}'
  mode: queued
  max: 10
- id: '1789400000003'
  alias: Kazán padlófűtés puffer szabályozás (40/38 °C, 06-22 óra)
  description: 'Amíg engedélyezett, 06:00-22:00 között: fűtés BE (heat_cool, 22,5
    °C), ha puffer VAGY tartály >40 °C, és legalább az egyik szobahőmérő <22 °C. Fűtés
    KI (cél 18 °C), ha mindkét elérhető puffer/tartály <38 °C (egyik elérhetetlen,
    a másik <38 °C is elég), VAGY bármelyik kültéri >23 °C, VAGY a szobahőmérséklet
    mindkét elérhető érzékelője >=22,5 °C, VAGY mindkét puffer/tartály érzékelő elérhetetlen
    (fail-safe KI). Egy szobaérzékelő kiesésekor a másik egyedül vezérel; ha mindkettő
    kiesik, a fűtés KI. 22-22,5 °C között az állapot nem változik (hiszterézis). 22:00-06:00
    között fűtés KI kényszerítve. Nyugalmi állapotban 0 szolgáltatáshívás.'
  triggers:
  - trigger: state
    entity_id: sensor.homero_puffer_external_temperature
  - trigger: state
    entity_id: sensor.futes_melegviz_tank_temperature
  - trigger: state
    entity_id: sensor.terasz_homero_emelet_temperature
  - trigger: state
    entity_id: sensor.kinti_foldszint_homero_temperature
  - trigger: state
    entity_id: sensor.futes_vaillant_vr921_outdoor_temperature
  - trigger: state
    entity_id: sensor.foldszint_nappali_homero_temperature
  - trigger: state
    entity_id: sensor.futes_padlofutes_circuit_0_current_temperature
  - trigger: time_pattern
    minutes: /1
  conditions: []
  actions:
  - variables:
      futesi_ido: '{{ now().hour >= 6 and now().hour < 22 }}'
      climate_ok: '{{ has_value(''climate.futes_padlofutes_circuit_0_climate'') }}'
      aktualis_mod: '{{ states(''climate.futes_padlofutes_circuit_0_climate'') }}'
      aktualis_cel: '{{ states(''sensor.futes_padlofutes_circuit_0_desired_heating_temperature'')
        | float(-999) if is_number(states(''sensor.futes_padlofutes_circuit_0_desired_heating_temperature''))
        else state_attr(''climate.futes_padlofutes_circuit_0_climate'', ''temperature'')
        | float(-999) }}'
      pu: '{{ states(''sensor.homero_puffer_external_temperature'') | float(0) }}'
      ta: '{{ states(''sensor.futes_melegviz_tank_temperature'') | float(0) }}'
      na: '{{ states(''sensor.foldszint_nappali_homero_temperature'') | float(0) }}'
      ci: '{{ states(''sensor.futes_padlofutes_circuit_0_current_temperature'') |
        float(0) }}'
      pu_ok: '{{ is_number(states(''sensor.homero_puffer_external_temperature''))
        }}'
      ta_ok: '{{ is_number(states(''sensor.futes_melegviz_tank_temperature'')) }}'
      na_ok: '{{ is_number(states(''sensor.foldszint_nappali_homero_temperature''))
        }}'
      ci_ok: '{{ is_number(states(''sensor.futes_padlofutes_circuit_0_current_temperature''))
        }}'
      puffer_be: '{{ (pu_ok and pu > 40) or (ta_ok and ta > 40) }}'
      puffer_ki: "{{ (pu_ok and ta_ok and pu < 38 and ta < 38)\n   or (pu_ok and not
        ta_ok and pu < 38)\n   or (ta_ok and not pu_ok and ta < 38) }}"
      puffer_nincs: '{{ not pu_ok and not ta_ok }}'
      kinti_stop: "{{ (is_number(states('sensor.terasz_homero_emelet_temperature'))\n
        \   and states('sensor.terasz_homero_emelet_temperature') | float > 23)\n
        \  or (is_number(states('sensor.kinti_foldszint_homero_temperature'))\n    and
        states('sensor.kinti_foldszint_homero_temperature') | float > 23)\n   or (is_number(states('sensor.futes_vaillant_vr921_outdoor_temperature'))\n
        \   and states('sensor.futes_vaillant_vr921_outdoor_temperature') | float
        > 23) }}"
      igeny_indit: '{{ (na_ok and na < 22.3) or (ci_ok and ci < 22.3) }}'
      igeny_stop: "{{ (na_ok and ci_ok and na >= 22.5 and ci >= 22.5)\n   or (na_ok
        and not ci_ok and na >= 22.5)\n   or (ci_ok and not na_ok and ci >= 22.5)
        }}"
      szoba_nincs: '{{ not na_ok and not ci_ok }}'
      leall: '{{ puffer_ki or kinti_stop or igeny_stop or szoba_nincs or puffer_nincs
        }}'
      indulhat: '{{ puffer_be and not leall and igeny_indit }}'
  - condition: template
    value_template: '{{ climate_ok }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ not futesi_ido }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ aktualis_mod != ''off'' }}'
        then:
        - action: climate.set_hvac_mode
          target:
            entity_id: climate.futes_padlofutes_circuit_0_climate
          data:
            hvac_mode: 'off'
    - conditions:
      - condition: template
        value_template: '{{ futesi_ido and leall }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ aktualis_mod != ''off'' and aktualis_cel != -999 and
            aktualis_cel != 18 }}'
        then:
        - action: climate.set_temperature
          target:
            entity_id: climate.futes_padlofutes_circuit_0_climate
          data:
            temperature: 18
      - if:
        - condition: template
          value_template: '{{ aktualis_mod != ''off'' }}'
        then:
        - action: climate.set_hvac_mode
          target:
            entity_id: climate.futes_padlofutes_circuit_0_climate
          data:
            hvac_mode: 'off'
    - conditions:
      - condition: template
        value_template: '{{ futesi_ido and indulhat }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ aktualis_mod != ''heat_cool'' and aktualis_cel != -999
            }}'
        then:
        - action: climate.set_hvac_mode
          target:
            entity_id: climate.futes_padlofutes_circuit_0_climate
          data:
            hvac_mode: heat_cool
      - if:
        - condition: template
          value_template: '{{ aktualis_cel != -999 and (aktualis_mod != ''heat_cool''
            or aktualis_cel != 22.5) }}'
        then:
        - action: climate.set_temperature
          target:
            entity_id: climate.futes_padlofutes_circuit_0_climate
          data:
            temperature: 22.5
  mode: single
- id: '1789400000004'
  alias: Fűtés vezérlés 3 - érzékelő hiba riasztás
  description: 'Riasztás, ha a fűtésvezérlés bármelyik entitása nem áll rendelkezésre
