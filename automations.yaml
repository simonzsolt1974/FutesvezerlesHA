      - sensor.futes_melegviz_tank_temperature
      - sensor.terasz_homero_emelet_temperature
      - sensor.kinti_foldszint_homero_temperature
      - sensor.futes_vaillant_vr921_outdoor_temperature
      - sensor.futes_padlofutes_circuit_0_current_temperature
      - sensor.futes_padlofutes_circuit_0_desired_heating_temperature
      - sensor.foldszint_konyha_homero_temperature
      - sensor.foldszint_haloszoba_homero_temperature
      - sensor.foldszint_furdoszoba_homero_temperature
      - sensor.foldszint_nappali_homero_temperature
