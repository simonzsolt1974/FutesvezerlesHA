            ablakZ: input_boolean.padlofutes_ablak_ciklus_furdoszoba
            szivZ: input_boolean.padlofutes_szivattyu_ciklus_furdoszoba
            napCel: 23.0
            ejszCel: 19.0
          - zona: nappali
            sw: switch.padlofutes_foldszint_l4
            temp: sensor.foldszint_nappali_homero_temperature
            kezdetN: input_number.padlofutes_kezdet_nappali
            kezdete: input_datetime.padlofutes_ido_nappali
            leallN: input_number.padlofutes_leall_nappali
            leallIdo: input_datetime.padlofutes_leall_ido_nappali
            durN: input_number.padlofutes_dur_nappali
            kintiN: input_number.padlofutes_kinti_nappali
            pvN: input_number.padlofutes_pv_nappali
            celN: input_number.padlofutes_cel_nappali
            figyelB: input_boolean.padlofutes_figyel_nappali
            maxN: input_number.padlofutes_max_nappali
            maxI: input_datetime.padlofutes_max_ido_nappali
            ablakZ: input_boolean.padlofutes_ablak_ciklus_nappali
            szivZ: input_boolean.padlofutes_szivattyu_ciklus_nappali
            napCel: 22.0
            ejszCel: 19.0
          zona: '{% set l = (zonaList | selectattr(''sw'', ''equalto'', entityType)
            | list) %} {{ l[0] if l | length > 0 else none }}'
      - variables:
          tempOk: '{{ is_number(states(zona.temp)) if zona is not none else false
            }}'
          temp: '{{ states(zona.temp) | float(0) if tempOk else -1 }}'
          kezdet: '{{ states(zona.kezdetN) | float(0) if zona is not none else 0 }}'
          kezdeteStr: '{{ states(zona.kezdete) if zona is not none else '''' }}'
          rendben_kezd: '{{ kezdet > 0 and (as_timestamp(kezdeteStr) or 0) > 0 }}'
          dur: '{{ ((as_timestamp(now()) - as_timestamp(kezdeteStr)) / 60) | round(0)
            if rendben_kezd else 0 }}'
          kinti: '{% set s1 = states(''sensor.terasz_homero_emelet_temperature'')
            %} {% set s2 = states(''sensor.kinti_foldszint_homero_temperature'') %}
            {% set s3 = states(''sensor.futes_vaillant_vr921_outdoor_temperature'')
            %} {% set vals = [] %} {% if is_number(s1) %}{% set vals = vals + [s1
            | float] %}{% endif %} {% if is_number(s2) %}{% set vals = vals + [s2
            | float] %}{% endif %} {% if is_number(s3) %}{% set vals = vals + [s3
            | float] %}{% endif %} {{ (vals | sum) / (vals | length) if vals | length
            > 0 else 0 }}'
          kinOk: '{{ is_number(states(''sensor.terasz_homero_emelet_temperature''))
            or is_number(states(''sensor.kinti_foldszint_homero_temperature'')) or
            is_number(states(''sensor.futes_vaillant_vr921_outdoor_temperature''))
            }}'
          pv: '{{ states(''sensor.solplanet_ht00306022230042_mppt_1_power'') | float(0)
            if is_number(states(''sensor.solplanet_ht00306022230042_mppt_1_power''))
            else 0 }}'
          ejszaka: '{{ now().hour >= 21 or now().hour < 6 }}'
          ejszakaPercek: "{% if now().hour >= 21 %}\n  {{ (now().hour - 21) * 60 +
            now().minute }}\n{% else %}\n  {{ (now().hour + 3) * 60 + now().minute
            }}\n{% endif %}"
          ejszakaLepes: '{{ ((ejszakaPercek | int) // 30) * 0.5 }}'
          celErtek: "{% if zona is not none and not ejszaka %}\n  {{ zona.napCel }}\n{%
            elif zona is not none %}\n  {{ [zona.ejszCel, (zona.napCel - ejszakaLepes)
            | float] | max }}\n{% else %}\n  0\n{% endif %}"
          ablakVolt: '{{ is_state(zona.ablakZ, ''on'') if zona is not none else false
            }}'
          szivVolt: '{{ is_state(zona.szivZ, ''on'') if zona is not none else false
            }}'
          durOk: '{{ dur >= 5 and dur <= 360 }}'
          hofokOk: '{{ temp > kezdet }}'
          rendben: '{{ zona is not none and tempOk and rendben_kezd and kinOk and
            not ablakVolt and not szivVolt and durOk and hofokOk }}'
      - if:
        - condition: template
          value_template: '{{ rendben }}'
        then:
        - action: input_number.set_value
          target:
            entity_id: '{{ zona.leallN }}'
          data:
            value: '{{ temp | round(2) }}'
        - action: input_datetime.set_datetime
          target:
            entity_id: '{{ zona.leallIdo }}'
          data:
            datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
        - action: input_number.set_value
          target:
            entity_id: '{{ zona.durN }}'
          data:
            value: '{{ dur | round(0) }}'
        - action: input_number.set_value
          target:
            entity_id: '{{ zona.kintiN }}'
          data:
            value: '{{ kinti | round(2) }}'
        - action: input_number.set_value
          target:
            entity_id: '{{ zona.pvN }}'
          data:
            value: '{{ pv | round(0) }}'
        - action: input_number.set_value
          target:
            entity_id: '{{ zona.celN }}'
          data:
            value: '{{ celErtek | float(0) | round(2) }}'
        - action: input_number.set_value
          target:
            entity_id: '{{ zona.maxN }}'
          data:
            value: '{{ temp | round(2) }}'
        - action: input_datetime.set_datetime
          target:
            entity_id: '{{ zona.maxI }}'
          data:
            datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
        - action: input_boolean.turn_on
          target:
            entity_id: '{{ zona.figyelB }}'
  mode: queued
  max: 10
- id: '1789400000006'
  alias: Padlófűtés tanulás - utánmelegedés megfigyelés (földszint)
  description: 'Rev.7: a stagnálás-alapú lezárás ÉLŐ, a mostani minta szerint számba
    adott (maxFrisulMost-gáttal); a lezáró minta csúcsa így mindig a tényleges utána-melegedés
    maximum. JSON NINCS — a lezáró adat eventben (maxVege/leall/maxIdo/tanulando/zona)
    a 0007-nek.'
  triggers:
  - trigger: time_pattern
    minutes: /15
  - trigger: homeassistant
    event: start
  conditions: []
  actions:
  - repeat:
      for_each:
      - zona: konyha
        temp: sensor.foldszint_konyha_homero_temperature
        maxN: input_number.padlofutes_max_konyha
        maxI: input_datetime.padlofutes_max_ido_konyha
        leall: input_number.padlofutes_leall_konyha
        leallIdo: input_datetime.padlofutes_leall_ido_konyha
        figyelB: input_boolean.padlofutes_figyel_konyha
        tanulandoI: input_datetime.padlofutes_tanulando_ido_konyha
      - zona: haloszoba
        temp: sensor.foldszint_haloszoba_homero_temperature
        maxN: input_number.padlofutes_max_haloszoba
        maxI: input_datetime.padlofutes_max_ido_haloszoba
        leall: input_number.padlofutes_leall_haloszoba
        leallIdo: input_datetime.padlofutes_leall_ido_haloszoba
        figyelB: input_boolean.padlofutes_figyel_haloszoba
        tanulandoI: input_datetime.padlofutes_tanulando_ido_haloszoba
      - zona: furdoszoba
        temp: sensor.foldszint_furdoszoba_homero_temperature
        maxN: input_number.padlofutes_max_furdoszoba
        maxI: input_datetime.padlofutes_max_ido_furdoszoba
        leall: input_number.padlofutes_leall_furdoszoba
        leallIdo: input_datetime.padlofutes_leall_ido_furdoszoba
        figyelB: input_boolean.padlofutes_figyel_furdoszoba
        tanulandoI: input_datetime.padlofutes_tanulando_ido_furdoszoba
      - zona: nappali
        temp: sensor.foldszint_nappali_homero_temperature
        maxN: input_number.padlofutes_max_nappali
        maxI: input_datetime.padlofutes_max_ido_nappali
        leall: input_number.padlofutes_leall_nappali
        leallIdo: input_datetime.padlofutes_leall_ido_nappali
        figyelB: input_boolean.padlofutes_figyel_nappali
        tanulandoI: input_datetime.padlofutes_tanulando_ido_nappali
      sequence:
      - variables:
          figyel: '{{ is_state(repeat.item.figyelB, ''on'') }}'
          tempOk: '{{ is_number(states(repeat.item.temp)) }}'
          temp: '{{ states(repeat.item.temp) | float(0) if tempOk else -1 }}'
          maxRegi: '{{ states(repeat.item.maxN) | float(0) }}'
          zLeall: '{{ as_timestamp(states(repeat.item.leallIdo)) or 0 }}'
          zMax: '{{ as_timestamp(states(repeat.item.maxI)) or 0 }}'
          zMost: '{{ as_timestamp(now()) }}'
          zTanulando: '{{ as_timestamp(states(repeat.item.tanulandoI)) or 0 }}'
          elap: '{{ ((zMost - zLeall) / 60) | round(0) if zLeall > 0 else 1440 }}'
          atfedes: '{{ zTanulando > zLeall and zTanulando > 0 }}'
      - if:
        - condition: template
          value_template: '{{ figyel and tempOk and not atfedes and temp > maxRegi
            }}'
        then:
        - action: input_number.set_value
          target:
            entity_id: '{{ repeat.item.maxN }}'
          data:
            value: '{{ temp | round(2) }}'
        - action: input_datetime.set_datetime
          target:
            entity_id: '{{ repeat.item.maxI }}'
          data:
            datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
      - variables:
          zMaxFriss: '{{ as_timestamp(states(repeat.item.maxI)) or 0 }}'
          maxFrisulMost: '{{ figyel and tempOk and not atfedes and (zMaxFriss - zMost)
            | abs < 30 and states(repeat.item.maxN) | float(0) >= temp }}'
          maxStagnalUj: '{{ (zMost - zMaxFriss) / 60 >= 15 }}'
          lezarUj: '{{ elap >= 120 or (maxStagnalUj and elap >= 30 and not maxFrisulMost)
            }}'
      - if:
        - condition: template
          value_template: '{{ figyel and (atfedes or lezarUj) }}'
        then:
        - variables:
            maxNMost: '{{ states(repeat.item.maxN) | float(0) }}'
            maxIdoMost: '{{ states(repeat.item.maxI) }}'
            leallTemp: '{{ states(repeat.item.leall) | float(0) }}'
            celCiklus: '{{ states(''input_number.padlofutes_cel_'' ~ repeat.item.zona)
              }}'
        - event: padlofutes_ciklus_lezarva
          event_data:
            zona: '{{ repeat.item.zona }}'
            maxVege: '{{ maxNMost | round(2) }}'
            celCiklus: '{{ celCiklus if is_number(celCiklus) else ''unknown'' }}'
            leall: '{{ leallTemp | round(2) }}'
            maxIdo: '{{ maxIdoMost }}'
            tanulando: '{{ states(repeat.item.tanulandoI) }}'
        - action: input_boolean.turn_off
          target:
            entity_id: '{{ repeat.item.figyelB }}'
        - action: input_datetime.set_datetime
          target:
            entity_id: '{{ repeat.item.tanulandoI }}'
          data:
            datetime: '1970-01-01 00:00:00'
  mode: single
- id: '1789400000007'
  alias: Padlófűtés tanulás - reziduum korrekció (földszint)
  description: 'Rev.6: egyszerű reziduum-tanulás. Érvényes lezárt ciklus ES SZIGNIFIKÁNS
    IDŐBELI KEREZT (maxIdo < tanulando) esetén rise_new = [[rise_old + 0.2·(maxVege
    − cel), 0.05] | max, 1.5] | min   (rev.8 hordozható forma) Json és súlyozott 3-ciklusos
    predikció ELHAGYVA — egy zóna, egy tanult érték. Küszöb frissítés változatlan:
    max(cel−rise, 0.16).'
  triggers:
  - trigger: event
    event_type: padlofutes_ciklus_lezarva
    id: ciklus_vege
  - trigger: time_pattern
    minutes: /15
    id: periodikus
  - trigger: homeassistant
    event: start
    id: ha_start
  conditions: []
  actions:
  - variables:
      ejszaka: '{{ now().hour >= 21 or now().hour < 6 }}'
      ejszakaPercek: "{% if now().hour >= 21 %}\n  {{ (now().hour - 21) * 60 + now().minute
        }}\n{% else %}\n  {{ (now().hour + 3) * 60 + now().minute }}\n{% endif %}"
      ejszakaLepes: '{{ ((ejszakaPercek | int) // 30) * 0.5 }}'
      zonaList:
      - zona: konyha
        riseN: input_number.padlofutes_rise_konyha
        kuszobN: input_number.padlofutes_kuszob_konyha
        celN: input_number.padlofutes_cel_konyha
        napCel: 21.0
        ejszCel: 18.0
      - zona: haloszoba
        riseN: input_number.padlofutes_rise_haloszoba
        kuszobN: input_number.padlofutes_kuszob_haloszoba
        celN: input_number.padlofutes_cel_haloszoba
        napCel: 22.0
        ejszCel: 19.0
      - zona: furdoszoba
        riseN: input_number.padlofutes_rise_furdoszoba
        kuszobN: input_number.padlofutes_kuszob_furdoszoba
        celN: input_number.padlofutes_cel_furdoszoba
        napCel: 23.0
        ejszCel: 19.0
      - zona: nappali
        riseN: input_number.padlofutes_rise_nappali
        kuszobN: input_number.padlofutes_kuszob_nappali
        celN: input_number.padlofutes_cel_nappali
        napCel: 22.0
        ejszCel: 19.0
  - choose:
    - conditions:
      - condition: trigger
        id: ciklus_vege
      sequence:
      - variables:
          zona: '{% set l = (zonaList | selectattr(''zona'', ''equalto'', trigger.event.data.zona)
            | list) %} {{ l[0] if l | length > 0 else none }}'
          celErtek: "{% set raw = trigger.event.data.celCiklus\n  if trigger.event.data
            is mapping\n  and trigger.event.data.celCiklus is defined\n  else none
            %}\n{% if raw is not none and raw | is_number %}\n  {{ raw | float }}\n{%
            elif zona is not none and states(zona.celN) | is_number %}\n  {{ states(zona.celN)
            | float }}\n{% else %}\n  {{ none }}\n{% endif %}"
          celOk: '{{ celErtek is not none and celErtek | is_number }}'
          maxVege: '{% set raw = trigger.event.data.maxVege if (trigger.event.data
            is mapping and trigger.event.data.maxVege is defined) else none %} {{
            raw | float if raw is not none and raw | is_number else none }}'
          maxIdo: '{{ trigger.event.data.maxIdo if trigger.event.data is mapping and
            trigger.event.data.maxIdo is defined else '''' }}'
          tanulando: '{{ trigger.event.data.tanulando if trigger.event.data is mapping
            and trigger.event.data.tanulando is defined else '''' }}'
          maxIdoOk: "{{ zona is not none and (as_timestamp(maxIdo) or 0) > 0 and (
            (as_timestamp(tanulando) or 0) <= 0\n      or (as_timestamp(maxIdo) or
            0) <= (as_timestamp(tanulando) or 0) ) }}"
          regiTanult: '{% set raw = states(zona.riseN) if zona is not none else none
            %} {{ raw | float if raw is not none and raw | is_number else none }}'
          tulloves: "{% if maxVege is not none and maxVege | is_number and celOk and
            celErtek is not none %}\n  {{ (maxVege - celErtek | float) | round(2)
            }}\n{% else %}\n  {{ none }}\n{% endif %}"
          hatarolt: "{% if tulloves is not none and tulloves | is_number and regiTanult
            | is_number %}\n  {{ [[regiTanult + 0.2 * tulloves, 0.05] | max, 1.5]
            | min | round(2) }}\n{% else %}\n  {{ none }}\n{% endif %}"
          celMost: "{% if zona is not none and not ejszaka %}\n  {{ zona.napCel }}\n{%
            elif zona is not none %}\n  {{ [zona.ejszCel, (zona.napCel - ejszakaLepes)
            | float] | max }}\n{% else %}\n  0\n{% endif %}"
          kuszobUj: "{% if hatarolt is not none and hatarolt | is_number %}\n  {{
            [celMost - hatarolt, 0.16] | max | round(2) }}\n{% else %}\n  {{ none
            }}\n{% endif %}"
      - if:
        - condition: template
          value_template: '{{ zona is not none and maxIdoOk and hatarolt is not none
            and hatarolt | is_number and kuszobUj is not none and kuszobUj | is_number
            }}'
        then:
        - action: input_number.set_value
          target:
            entity_id: '{{ zona.riseN }}'
          data:
            value: '{{ hatarolt }}'
        - action: input_number.set_value
          target:
            entity_id: '{{ zona.kuszobN }}'
          data:
            value: '{{ kuszobUj }}'
    - conditions:
      - condition: trigger
        id:
        - periodikus
        - ha_start
      sequence:
      - repeat:
          for_each:
          - riseN: input_number.padlofutes_rise_konyha
            kuszobN: input_number.padlofutes_kuszob_konyha
            napCel: 21.0
            ejszCel: 18.0
          - riseN: input_number.padlofutes_rise_haloszoba
            kuszobN: input_number.padlofutes_kuszob_haloszoba
            napCel: 22.0
            ejszCel: 19.0
          - riseN: input_number.padlofutes_rise_furdoszoba
            kuszobN: input_number.padlofutes_kuszob_furdoszoba
            napCel: 23.0
            ejszCel: 19.0
          - riseN: input_number.padlofutes_rise_nappali
            kuszobN: input_number.padlofutes_kuszob_nappali
            napCel: 22.0
            ejszCel: 19.0
          sequence:
          - variables:
              riseErvenyes: '{{ states(repeat.item.riseN) | is_number }}'
              rise: '{{ states(repeat.item.riseN) | float(0) }}'
              celMost: "{% if not ejszaka %}\n  {{ repeat.item.napCel }}\n{% else
                %}\n  {{ [repeat.item.ejszCel, (repeat.item.napCel - ejszakaLepes)
                | float] | max }}\n{% endif %}"
              kuszobUj: "{% if rise > 0 %}\n  {{ [celMost - rise, 0.16] | max | round(2)
                }}\n{% else %}\n  0\n{% endif %}"
          - if:
            - condition: template
              value_template: '{{ riseErvenyes }}'
            then:
            - action: input_number.set_value
              target:
                entity_id: '{{ repeat.item.kuszobN }}'
              data:
                value: '{{ kuszobUj }}'
  mode: single
- id: konyha_bojler_homerseklet_szabalyozas
