    name: Ciklus célhőfok - Konyha
    min: 0
    max: 40
    step: 0.1
    mode: box
    unit_of_measurement: "°C"
  padlofutes_cel_haloszoba:
    name: Ciklus célhőfok - Hálószoba
    min: 0
    max: 40
    step: 0.1
    mode: box
    unit_of_measurement: "°C"
  padlofutes_cel_furdoszoba:
    name: Ciklus célhőfok - Fürdőszoba
