  padlofutes_max_nappali:
    name: Zárás utáni max hőfok - Nappali
    min: 0
    max: 40
    step: 0.1
    mode: box
    unit_of_measurement: "°C"

  # Fűtés időtartama (perc)
  padlofutes_dur_konyha:
