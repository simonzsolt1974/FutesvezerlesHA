    min: 0
    max: 5
    step: 0.1
    mode: box
    unit_of_measurement: "°C"
  padlofutes_rise_furdoszoba:
    name: Tanult utánmelegedés - Fürdőszoba
    min: 0
    max: 5
    step: 0.1
    mode: box
    unit_of_measurement: "°C"
  padlofutes_rise_nappali:
    name: Tanult utánmelegedés - Nappali
    min: 0
    max: 5
    step: 0.1
    mode: box
    unit_of_measurement: "°C"

  # --- Alacsonyabb szintű ciklus-nyilvántartás (0005/0006 közti átmenet) ---
