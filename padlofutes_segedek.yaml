# =============================================================================
#  Padlófűtés prediktív tanuló rendszer - SEGÉD-ENTITÁSOK (földszint, 4 zóna)
# =============================================================================
#  BETÖLTÉS – FIGYELEM, csak EGYSÉGES módszer az ajánlott:
#
#  AJÁNLOTT: PACKAGE MÓDSZER.
#    A fájl NÉGY domain-t tartalmaz (input_boolean / input_number /
#    input_datetime / input_text), ezért csak komplett package-ként
#    tölthető be. A configuration.yaml-ben:
#
#      homeassistant:
#        packages: !include_dir_merge_named packages
#
#    és ezt a fájlt a `packages/padlofutes_segedek.yaml` helyre tenni.
#
#  NEM AJÁNLOTT: `input_boolean: !include padlofutes_segedek.yaml`
#    Ez csak akkor működne, ha a fájlban CSAK az input_boolean alatti
#    entitás-definíciók lennének (a négy domain együtt). Ez a fájl
#    szándékosan négy domént tartalmaz, ezért az include módszer
#    konfigurációs hibát adna.
#
#  A segéd-entitások perzisztensek: HA újraindítás után a tanult értékek
#  megmaradnak (nincs `initial:`, így nem resetelődnek). Első használatkor
#  a 0005/0006/0007 számol az üres (unknown/unavailable) állapotokkal:
#  - rev.6: a JSON ciklus-tárolás megszűnt — nincs input_text, a lezáró
#    adat a 0006 custom EVENT-jében (padlofutes_ciklus_lezarva) jut át
#    a 0007-be (maxVege/leall/maxIdo/tanulando/zona).
#  - az `as_timestamp(... or 0)` mintázat biztosítja, hogy nem beállított
#    input_datetime (1970 előtti vagy unknown) 0-ává válik és nem okoz
#    template-hibát.
#
#  Ezek az entitások nem rendelkeznek felhasználói felülettel, csak a
#  0001 / 0005 / 0006 / 0007 automatizmusok használják őket.
# ============================================================================

input_boolean:
  # Predikciós engedélyezés zónánként (kikapcsolva: klasszikus ±0,2 °C hiszterézis)
  padlofutes_prediktiv_konyha:
    name: Prediktív zárás - Konyha
  padlofutes_prediktiv_haloszoba:
    name: Prediktív zárás - Hálószoba
  padlofutes_prediktiv_furdoszoba:
    name: Prediktív zárás - Fürdőszoba
  padlofutes_prediktiv_nappali:
    name: Prediktív zárás - Nappali

  # Zárás utáni utánmelegedés megfigyelés aktív jelzője
  # Érvénytelenítő zászlók: ciklus közben történt ablaknyitás / szivattyú-kiesés
  # (0005 állítja, a ciklus lezárásakor a talált érték alapján értékeli ki 0006)
  padlofutes_ablak_ciklus_konyha:
    name: Ablak a ciklusban - Konyha
  padlofutes_ablak_ciklus_haloszoba:
    name: Ablak a ciklusban - Hálószoba
  padlofutes_ablak_ciklus_furdoszoba:
    name: Ablak a ciklusban - Fürdőszoba
  padlofutes_ablak_ciklus_nappali:
    name: Ablak a ciklusban - Nappali

  padlofutes_szivattyu_ciklus_konyha:
    name: Szivattyú-kiesés a ciklusban - Konyha
  padlofutes_szivattyu_ciklus_haloszoba:
    name: Szivattyú-kiesés a ciklusban - Hálószoba
  padlofutes_szivattyu_ciklus_furdoszoba:
    name: Szivattyú-kiesés a ciklusban - Fürdőszoba
  padlofutes_szivattyu_ciklus_nappali:
    name: Szivattyú-kiesés a ciklusban - Nappali

  padlofutes_figyel_konyha:
    name: Utánmelegedés figyelés - Konyha
  padlofutes_figyel_haloszoba:
    name: Utánmelegedés figyelés - Hálószoba
  padlofutes_figyel_furdoszoba:
    name: Utánmelegedés figyelés - Fürdőszoba
  padlofutes_figyel_nappali:
    name: Utánmelegedés figyelés - Nappali

