  # --- Predikció kimenetek -----------------------------------------------
  # Prediktív zárási küszöb: a szelep ezt a hőmérsékletet elérve ZÁR.
  # 0 = a tanulás nem eléggé megbízható, 0001 a klasszikus ±0,2 hiszterézist használja.
  padlofutes_kuszob_konyha:
    name: Prediktív zárási küszöb - Konyha
    min: 0
    max: 40
    step: 0.1
    mode: box
    unit_of_measurement: "°C"
  padlofutes_kuszob_haloszoba:
    name: Prediktív zárási küszöb - Hálószoba
    min: 0
    max: 40
    step: 0.1
    mode: box
    unit_of_measurement: "°C"
  padlofutes_kuszob_furdoszoba:
    name: Prediktív zárási küszöb - Fürdőszoba
    min: 0
    max: 40
    step: 0.1
    mode: box
    unit_of_measurement: "°C"
  padlofutes_kuszob_nappali:
    name: Prediktív zárási küszöb - Nappali
    min: 0
    max: 40
    step: 0.1
    mode: box
    unit_of_measurement: "°C"

  # A megtanult tipikus utánmelegedés (rise) °C -ban
  padlofutes_rise_konyha:
    name: Tanult utánmelegedés - Konyha
    min: 0
    max: 5
    step: 0.1
    mode: box
    unit_of_measurement: "°C"
  padlofutes_rise_haloszoba:
