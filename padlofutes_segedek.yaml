  padlofutes_tanulando_ido_konyha:
    name: Lezárandó megfigyelés idő - Konyha
    has_date: true
    has_time: true
  padlofutes_tanulando_ido_haloszoba:
    name: Lezárandó megfigyelés idő - Hálószoba
    has_date: true
    has_time: true
  padlofutes_tanulando_ido_furdoszoba:
    name: Lezárandó megfigyelés idő - Fürdőszoba
    has_date: true
    has_time: true
  padlofutes_tanulando_ido_nappali:
    name: Lezárandó megfigyelés idő - Nappali
    has_date: true
    has_time: true

  # Ciklus kezdete (a szelep NYIT-nak történő időbélyege)
  padlofutes_ido_konyha:
    name: Ciklus kezdete (idő) - Konyha
    has_date: true
    has_time: true
  padlofutes_ido_haloszoba:
    name: Ciklus kezdete (idő) - Hálószoba
    has_date: true
    has_time: true
  padlofutes_ido_furdoszoba:
    name: Ciklus kezdete (idő) - Fürdőszoba
    has_date: true
    has_time: true
  padlofutes_ido_nappali:
    name: Ciklus kezdete (idő) - Nappali
    has_date: true
    has_time: true

  # Ciklus vége (a szelep ZÁR-nak történő időbélyege)
  padlofutes_leall_ido_konyha:
    name: Ciklus vége (idő) - Konyha
    has_date: true
    has_time: true
  padlofutes_leall_ido_haloszoba:
    name: Ciklus vége (idő) - Hálószoba
    has_date: true
    has_time: true
  padlofutes_leall_ido_furdoszoba:
    name: Ciklus vége (idő) - Fürdőszoba
    has_date: true
    has_time: true
  padlofutes_leall_ido_nappali:
    name: Ciklus vége (idő) - Nappali
    has_date: true
    has_time: true

  # Az utolsó utánmelegedés-csúcs pillanata (a "megállt a melegedés" észleléséhez)
  padlofutes_max_ido_konyha:
    name: Utánmelegedés csúcsa (idő) - Konyha
    has_date: true
    has_time: true
  padlofutes_max_ido_haloszoba:
    name: Utánmelegedés csúcsa (idő) - Hálószoba
    has_date: true
    has_time: true
  padlofutes_max_ido_furdoszoba:
    name: Utánmelegedés csúcsa (idő) - Fürdőszoba
    has_date: true
    has_time: true
  padlofutes_max_ido_nappali:
    name: Utánmelegedés csúcsa (idő) - Nappali
    has_date: true
    has_time: true

# ----------------------------------------------------------------------------
#  rev.6 MEGJEGYZES: az `input_text` domain KIkerult a seged-fajlbol.
#
#  A korabbi `padlofutes_ciklusok_*` input_text entitasok (255 char JSON
#  ciklus-adatbazis) a rev.6 egyszerusitett tanulasban mar NINCS
#  hasznalatban: a lezaro ciklus adatai a 0006 -> 0007 custom EVENT-jeben
#  (padlofutes_ciklus_lezarva) jutnak at (maxVege / leall / maxIdo /
#  tanulando / zona), a tanult ertek a `padlofutes_rise_*` numerikus
#  input_number-okben el.
#
#  HA-ban a regi entitasok kezi torlese a takaritas kedveert ajanlott
#  (senki nem olvassa oket, igy a torlesuk NEM kotelezo a mukodeshez):
#  Beallitasok -> Eszkozok es szolgaltatasok -> Segedok -> 'Tanult ciklusok - ...'
#  -> Torles (mind a negy zonara).
# ----------------------------------------------------------------------------
